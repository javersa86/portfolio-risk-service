# GitHub Actions: on every push and pull request, spin up a fresh Linux
# machine plus a Postgres container, install the project, and run the
# same checks you ran locally. Any failing step turns the commit red.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres just for this run (same image as docker-compose).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: risk
          POSTGRES_PASSWORD: risk
          POSTGRES_DB: risk
        ports:
          - 5432:5432
        # Wait until Postgres accepts connections before running steps.
        options: >-
          --health-cmd "pg_isready -U risk"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Read by conftest.py. No API key anywhere: tests never hit the network.
    env:
      TEST_DATABASE_URL: postgresql+psycopg://risk:risk@localhost:5432/risk_test

    steps:
      - uses: actions/checkout@v5          # get the code
      - uses: actions/setup-python@v6      # install Python
        with:
          python-version: "3.11"
          cache: pip                        # reuse downloads between runs
      - run: pip install -e ".[dev]"
      - run: ruff format --check .          # --check: fail instead of fixing
      - run: ruff check .
      - run: mypy api ingest
      - run: pytest -v